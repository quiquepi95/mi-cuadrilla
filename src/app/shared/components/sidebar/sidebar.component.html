<nav class="sidebar" [class.collapsed]="collapsed()">

  <!-- Header / Logo -->
  <div class="sidebar-header">
    <div class="logo-area">
      <ion-icon name="flame-outline" class="logo-icon"></ion-icon>
      @if (!collapsed()) {
        <div class="logo-text-area">
          <span class="logo-text">Mi Cuadrilla</span>
        </div>
      }
    </div>
    <button class="collapse-btn" (click)="toggle()" [title]="collapsed() ? 'Expandir menú' : 'Colapsar menú'">
      <ion-icon [name]="collapsed() ? 'chevron-forward-outline' : 'chevron-back-outline'"></ion-icon>
    </button>
  </div>

  <!-- Navegación principal -->
  <div class="nav-section">
    @if (!collapsed()) {
      <span class="nav-section-label">Gestión</span>
    }

    @for (item of navItems; track item) {
      <a
        class="nav-item"
        [class.active]="isActive(item.route)"
        [routerLink]="item.route"
        [title]="collapsed() ? item.label : ''"
        >
        <ion-icon [name]="item.icon" class="nav-icon"></ion-icon>
        @if (!collapsed()) {
          <span class="nav-label">{{ item.label }}</span>
        }
        @if (isActive(item.route) && collapsed()) {
          <span class="nav-active-dot"></span>
        }
      </a>
    }
  </div>

  <!-- Divider -->
  <div class="sidebar-divider"></div>

  <!-- Footer con perfil -->
  <div class="sidebar-footer">
    <a class="nav-item" routerLink="/perfil" [title]="collapsed() ? 'Mi perfil' : ''">
      <div class="avatar-small">MC</div>
      @if (!collapsed()) {
        <div class="user-info">
          <span class="user-name">Mi Capataz</span>
          <span class="user-role">Capataz</span>
        </div>
      }
    </a>
    @if (!collapsed()) {
      <span class="app-version">v{{ version }}</span>
    }
  </div>

</nav>
